version: '3.8'

# ملف التشغيل الميداني لبيئات الإنتاج — منصة صفقات ذكية
# تشغيل: docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    container_name: safaqat_postgres_prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safaqat_db}
      POSTGRES_USER: ${POSTGRES_USER:-safaqat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safaqat_user} -d ${POSTGRES_DB:-safaqat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safaqat_prod_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safaqat_django_prod
    restart: always
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DB_ENGINE=postgresql
      - POSTGRES_DB=${POSTGRES_DB:-safaqat_db}
      - POSTGRES_USER=${POSTGRES_USER:-safaqat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,web,nginx,safaqat.dz,www.safaqat.dz}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://safaqat.dz,https://safaqat.dz}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://safaqat.dz,https://safaqat.dz}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
    volumes:
      - django_static_prod:/app/staticfiles
      - django_media_prod:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - safaqat_prod_network

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: safaqat_nginx_prod
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
      - "${SSL_PORT:-443}:443"
    volumes:
      - django_static_prod:/app/staticfiles:ro
      - django_media_prod:/app/media:ro
    depends_on:
      - backend
    networks:
      - safaqat_prod_network

volumes:
  postgres_data_prod:
    name: safaqat_postgres_data_prod
  django_static_prod:
    name: safaqat_django_static_prod
  django_media_prod:
    name: safaqat_django_media_prod

networks:
  safaqat_prod_network:
    name: safaqat_prod_network
    driver: bridge
