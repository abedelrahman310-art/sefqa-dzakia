{% extends 'base/base.html' %}

{% block title %}Delete Tender - Tenders Dashboard{% endblock %}

{% block content %}
<div class="confirm-delete">
    <h2>Delete Tender</h2>
    <p>Are you sure you want to delete the tender "<strong>{{ tender.title }}</strong>"?</p>
    <p class="warning">This action cannot be undone.</p>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'tenders:detail' tender.pk %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
