version: '3.8'

services:
  # ══════════════════════════════════════════════════════════════════════════════
  # 1. قاعدة البيانات علائقية معتمدة PostgreSQL 16 مع دعم pgvector
  # ══════════════════════════════════════════════════════════════════════════════
  db:
    image: pgvector/pgvector:pg16
    container_name: safaqat_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safaqat_db}
      POSTGRES_USER: ${POSTGRES_USER:-safaqat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safaqat_user} -d ${POSTGRES_DB:-safaqat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safaqat_network

  # ══════════════════════════════════════════════════════════════════════════════
  # 2. خادم وسيط الرسائل Redis لطبقة قنوات Channels والبث اللحظي
  # ══════════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: safaqat_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - safaqat_network

  # ══════════════════════════════════════════════════════════════════════════════
  # 3. الواجهة الخلفية المعيارية Django REST Framework + Daphne ASGI (WebSockets)
  # ══════════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safaqat_django
    restart: always
    environment:
      - DJANGO_DEBUG=${DJANGO_DEBUG:-False}
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DB_ENGINE=postgresql
      - POSTGRES_DB=${POSTGRES_DB:-safaqat_db}
      - POSTGRES_USER=${POSTGRES_USER:-safaqat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,web,nginx,safaqat.dz,www.safaqat.dz}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-http://localhost,http://127.0.0.1,http://localhost:80,http://localhost:5173}
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - django_static:/app/staticfiles
      - django_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - safaqat_network

  # ══════════════════════════════════════════════════════════════════════════════
  # 4. بوابة وخادم الويب العكسي Nginx + تطبيق الواجهة الأمامية React PWA
  # ══════════════════════════════════════════════════════════════════════════════
  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    container_name: safaqat_nginx
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - django_static:/app/staticfiles:ro
    depends_on:
      - backend
    networks:
      - safaqat_network

volumes:
  postgres_data:
    name: safaqat_postgres_data
  django_static:
    name: safaqat_django_static
  django_media:
    name: safaqat_django_media

networks:
  safaqat_network:
    name: safaqat_network
    driver: bridge
