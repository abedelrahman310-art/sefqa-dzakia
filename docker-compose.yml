version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: safaqat_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-safaqat_db}
      POSTGRES_USER: ${POSTGRES_USER:-safaqat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-safaqat_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-safaqat_user} -d ${POSTGRES_DB:-safaqat_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safaqat_django
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      - DJANGO_DEBUG=True
      - DJANGO_SECRET_KEY=safaqat-docker-dev-secret-key-change-in-production
      - DB_ENGINE=postgresql
      - POSTGRES_DB=${POSTGRES_DB:-safaqat_db}
      - POSTGRES_USER=${POSTGRES_USER:-safaqat_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-safaqat_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
