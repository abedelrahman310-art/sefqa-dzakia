# ══════════════════════════════════════════════════════════════════════════════
# Render Blueprint Specification — منصة صفقات ذكية
# ══════════════════════════════════════════════════════════════════════════════

databases:
  - name: safaqat-db
    databaseName: safaqat
    user: safaqat_user
    plan: free
    region: frankfurt

services:
  # 1. خادم Redis للقنوات المؤتمتة (Channels) وذاكرة التخزين المؤقت
  - type: redis
    name: safaqat-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  # 2. خادم الواجهة الخلفية الدانقو (Daphne ASGI + REST API + WebSockets)
  - type: web
    name: safaqat-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: frankfurt
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: safaqat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safaqat-redis
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://safaqat-frontend.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://safaqat-frontend.onrender.com,https://safaqat-backend.onrender.com"
      - key: GEMINI_API_KEY
        sync: false

  # 3. الواجهة الأمامية الثابتة فائقة السرعة (React SPA CDN)
  - type: web
    name: safaqat-frontend
    runtime: static
    buildCommand: "npm install -g pnpm && pnpm install && pnpm --filter client build"
    staticPublishPath: client/dist
    routes:
      - type: rewrite
        source: /api/*
        destination: https://safaqat-backend.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: "https://safaqat-backend.onrender.com"
      - key: VITE_ENABLE_DEMO_LOGIN
        value: "true"
